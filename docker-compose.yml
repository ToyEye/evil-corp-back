services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evilcorp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evilcorp}
      POSTGRES_DB: ${POSTGRES_DB:-evilcorp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-evilcorp} -d ${POSTGRES_DB:-evilcorp}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
